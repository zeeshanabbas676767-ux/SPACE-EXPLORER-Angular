<style>
	/* ===============================
   HERO SECTION
================================ */
.hero-section {
  width: 100%;
  overflow: hidden;
}

/* ===============================
   SLIDER
================================ */
.hero-slider {
  width: 100%;
}

.hero-slide {
  height: 100vh;
  background-size: cover;
  background-position: center;
  position: relative;
  display: flex;
  align-items: center;
}

/* Dark overlay */
.hero-slide::before {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.35);
}

/* ===============================
   CONTAINER
================================ */
.hero-container {
  max-width: 1200px;
  margin: auto;
  padding: 0 20px;
  width: 100%;
  position: relative;
  z-index: 2;
}

/* ===============================
   CONTENT
================================ */
.slide-content {
  color: #fff;
  max-width: 600px;
  animation: slideFade 1.2s ease;
}

.slide-subtitle {
  font-size: 20px;
  letter-spacing: 3px;
  text-transform: uppercase;
  display: block;
  margin-bottom: 15px;
}

.slide-title {
  font-size: 60px;
  font-weight: 700;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 35px;
}

/* ===============================
   BUTTON
================================ */
.slide-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 170px;
  height: 48px;
  background-color: #717fe0;
  color: #fff;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  border-radius: 25px;
  transition: all 0.3s ease;
}

.slide-button:hover {
  background-color: #fff;
  color: #717fe0;
}

/* ===============================
   ANIMATION
================================ */
@keyframes slideFade {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===============================
   RESPONSIVE
================================ */
@media (max-width: 992px) {
  .slide-title {
    font-size: 44px;
  }
}

@media (max-width: 576px) {
  .slide-content {
    text-align: center;
  }

  .slide-title {
    font-size: 32px;
  }

  .slide-subtitle {
    font-size: 16px;
  }
}

</style>
