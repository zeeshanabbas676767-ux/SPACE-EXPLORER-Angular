
<style>

  button.btn:disabled {
  cursor: not-allowed !important;
  pointer-events: all;
}

</style>

<div class="card mt-5">
<div class="card-body mt-5">
  <h1 class="text-center">SpaceRolesItems Management</h1>

  <!-- Create Button -->
  <div class="button-group">
    <button 
      *ngIf="!showCreateForm && !editingId" 
      (click)="toggleCreateForm()"
      class="btn btn-dark">
      + Create New Space Role Item
    </button>
  </div>
  <!-- Error State -->
  <div *ngIf="error" class="error-message text-center" style="font-size: 20px;">
    ✗ {{ error }}
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading-message text-center" style="font-size: 20px;">
    Loading...
  </div>
  <!-- Create Form -->
  <div *ngIf="showCreateForm" class="form-container">
    <form (ngSubmit)="createProduct()" class="product-form">
    <div class="row" style="display: flex;">
        <div class="col-md-3">
           <div class="form-group">
          <label style="font-size: large;">Select Space Role *</label>
       <select class="form-control  col-md-9"  style="font-size: medium;"
    [(ngModel)]="formData.spaceRolesId"
    name="spaceRolesId" [ariaPlaceholder]=""
    required>
   <option [ngValue]="" disabled selected> Select Space Role </option>
    <option *ngFor="let c of spaceRoles" [value]="c.id">
      {{ c.spaceRoleName }}
    </option>
  </select>
  </div>
  </div>

        <div class="col-md-3">
      <div class="form-group">
        <label style="font-size: large;">Space Role Item Name *</label>
        <input class="form-control col-md-9"
          type="text"  style="font-size: medium;"
          [(ngModel)]="formData.name" 
          name="name"
          placeholder="Enter space role item name"
          required>
      </div>
        </div>


        </div>
      <div class="form-buttons">
        <button type="submit" class="btn btn-dark" [disabled]="loading">
          {{ loading ? 'Creating...' : 'Create Space Role Item' }}
        </button>
        <button type="button" (click)="toggleCreateForm()" class="btn btn-secondary"  style="margin-left: 10px;">
          Cancel
        </button>
      </div>
    </form>
  </div>

  <!-- Edit Form -->
  <div *ngIf="editingId" class="form-container">
    <form (ngSubmit)="updateProduct()" class="product-form">
      <div class="row" style="display: flex;">
        <div class="col-md-3">
      <div class="form-group">
        <label style="font-size: large;">Space Role Item Name *</label>
        <input class="form-control col-md-9"
          type="text"  style="font-size: medium;"
          [(ngModel)]="formData.name" 
          name="name"
          placeholder="Enter space role item name"
          required>
      </div>
     </div>
    
      </div>
      <div class="form-buttons">
        <button type="submit" class="btn btn-success" [disabled]="loading">
          {{ loading ? 'Updating...' : 'Update Space Role Item' }}
        </button>
        <button type="button" (click)="cancelEdit()" class="btn btn-secondary"  style="margin-left: 10px;">
          Cancel
        </button>
      </div>
    </form>
  </div>


<div class="card" *ngIf="!loading && items.length > 0 && !showCreateForm && !editingId">
  <div class="card-body">
<div class="table-responsive" style="max-height: 400px; overflow-y: visible;">
  <table class="table table-bordered table-hover align-middle txt-center">
    <thead class="table-dark sticky-top">
      <tr>
        <th>Name</th>
        <th>Space Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of items">
        <td> {{ p.name }}</td>
        <td> {{ p.spaceRole_Name }}</td>
        <td> 
          <button
            class="btn btn-outline-success btn-sm me-1"
            (click)="startEdit(p)"
            title="Edit"
          >   <i class="fa fa-edit"></i>
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="deleteProduct(p.id)"
            title="Delete"
          >  <i class="fa fa-trash"></i>
          </button>
        </td>
      </tr>
      <!-- Empty State -->
      <tr *ngIf="items.length === 0">
        <td colspan="5" class="text-center text-muted py-4">
          No Space Roles Items found
        </td>
      </tr>
    </tbody>
  </table>
</div>

  </div>
</div>
</div>
</div>
