<style>
  /* Fix body overlap for fixed top navbar */
body {
  padding-top: 65px;
}

/* Nav Links Styling */
.navbar .nav-link {
  color: rgba(255, 255, 255, 0.75) !important;
  font-size: 0.9rem;
  font-weight: 500;
  border-radius: 6px;
  transition: all 0.2s ease-in-out;
}

.navbar .nav-link:hover {
  color: #ffffff !important;
  background-color: rgba(255, 255, 255, 0.1);
}

/* Active Link Highlight */
.navbar .nav-link.active {
  color: #ffffff !important;
  background-color: #0d6efd;
  font-weight: 600;
}

/* Small custom badge styling */
.fs-7 {
  font-size: 0.65rem;
  letter-spacing: 0.5px;
  vertical-align: middle;
}
</style>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top border-bottom border-secondary shadow-sm px-3">
  <div class="container-fluid">
    
    <!-- Logo / Brand -->
    <a class="navbar-brand d-flex align-items-center me-4" routerLink="/admin/dashboard">
      <i class="mdi mdi-orbit text-info fs-3 me-2"></i>
      <span class="fw-bold text-white fs-5 tracking-wide">SpaceExplorer</span>
      <span class="badge bg-primary ms-2 fs-7">ADMIN</span>
    </a>

    <!-- Mobile Menu Toggle Button -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation items -->
    <div class="collapse navbar-collapse" id="adminNavbarNav" style="margin-left: 100px;">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-1">
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/dashboard" routerLinkActive="active">Dashboard</a>
        </li>
        <!-- <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/products" routerLinkActive="active">Space Products</a>
        </li> -->
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/spaceRoles" routerLinkActive="active">Space Roles</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/spaceRolesitems" routerLinkActive="active">Space Roles Items</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/role" routerLinkActive="active">Role</a>
        </li>
        <!-- <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/category" routerLinkActive="active">Category</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/orders" routerLinkActive="active">Orders</a>
        </li> -->
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/universeData" routerLinkActive="active">Universe Data</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-light px-2" routerLink="/admin/users" routerLinkActive="active">Users</a>
        </li>
      </ul>

      <!-- Right Action Tools & Profile -->
      <div class="d-flex align-items-center gap-2">

        <a routerLink="/home" class="btn btn-outline-light rounded-circle d-flex align-items-center justify-content-center p-0" style="width: 100px; height: 38px;" title="Back to Site">
          <i class="fa fa-arrow-left fs-6"></i>Back to Site
        </a>

        <div class="vr text-secondary mx-2 d-none d-lg-block" style="height: 24px;"></div>

        <!-- Admin Profile -->
        <ng-container *ngIf="isAdminLoggedIn; else authButtons">
          <button 
            class="btn btn-primary rounded-pill d-flex align-items-center px-3 gap-2" 
            type="button" 
            data-bs-toggle="offcanvas" 
            data-bs-target="#offcanvasNavbar">
            <i class="fa fa-user-circle fs-5"></i>
            <span class="fw-semibold text-truncate" style="max-width: 120px;">{{ user?.fullName || 'Profile' }}</span>
          </button>
        </ng-container>

        <ng-template #authButtons>
          <div class="d-flex gap-2">
            <a routerLink="/admin/login" class="btn btn-outline-success btn-sm">Login</a>
            <a routerLink="/admin/register" class="btn btn-primary btn-sm">Register</a>
          </div>
        </ng-template>
      </div>

    </div>
  </div>
</nav>


<div class="offcanvas offcanvas-end"
     tabindex="-1"
     id="offcanvasNavbar"
     aria-labelledby="offcanvasNavbarLabel">

  <div class="offcanvas-header border-bottom">
    <h3 class="offcanvas-title fw-bold" id="offcanvasNavbarLabel">
      My profile 
    </h3>
    <button type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"></button>
  </div>

  <div class="offcanvas-body p-0 d-flex flex-column">

    <i class="fa fa-user" style="text-align: center;font-size: 50px;"></i>
     <div class="text-center p-4">
       <strong><h5 class="mb-3">{{user?.fullName}}</h5></strong>
      <h6 class="mb-3">{{user?.email}}</h6>
    </div>

    <!-- FOOTER TOTAL + BUTTONS -->
    <div  class="border-top p-3 mt-auto">

  <button class="btn btn-danger w-100 mb-2" (click)="logout()">
       Logout
      </button>
    </div>
 
  </div>
</div>
